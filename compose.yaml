name: lotus-portfolio
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-lotus_portfolio}
      POSTGRES_USER: ${DB_USER:-lotus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:${DB_PORT:-55433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
